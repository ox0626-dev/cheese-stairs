<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:#103968}
  body{font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
  main{
    --game-height:var(--viewport-height,100%);
    position:absolute;top:var(--viewport-top,0px);left:var(--viewport-left,0px);
    width:var(--viewport-width,100%);height:var(--game-height);
    display:grid;grid-template: auto minmax(0,1fr) auto / minmax(0,1fr);gap:8px;
    padding:calc(8px + env(safe-area-inset-top,0px)) calc(8px + env(safe-area-inset-right,0px))

    background:linear-gradient(#123965,#4086b7 50%,#a5dbe8);touch-action:manipulation;
  }
  @supports(height:100dvh){main{--game-height:var(--viewport-height,100dvh)}}
  main[data-mode="playing"]{grid-template-rows:auto 1fr}
  main[data-mode="playing"]:not(:has(.sound-settings[open])){touch-action:none}
  main[data-mode="playing"] .stage{position:absolute;inset:0;grid-area:auto}
  main[data-mode="playing"] .hud{z-index:1}
  main[data-mode="playing"] .jump-hint{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px) - 16px);z-index:1}

  canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}

  .score strong{font-size:26px;line-height:1.12;color:#ffea87;font-variant-numeric:tabular-nums}

  .sound-settings h2{margin:0 0 14px;font-size:20px}
  .sound-setting{display:grid;grid-template-columns:1fr auto;align-items:center;gap:3px 10px;margin-bottom:10px;font-size:15px}

  .message{display:flex;flex-direction:column;width:min(350px,100%);max-height:min(480px,calc(var(--game-height) * .56));text-align:center;padding:15px;background:#0c2c52f2;border:1px solid #a9d7ff7d;border-radius:24px;box-shadow:0 8px 22px #0b284b4d}

  .ranking ol{margin:0;padding:0;list-style:none;text-align:left;touch-action:pan-y;font-variant-numeric:tabular-nums}
  .ranking li{display:grid;grid-template-columns:2ch minmax(0,1fr) auto;align-items:center;gap:9px;padding:6px 8px;border-top:1px solid #a9d7ff35;font-size:13px}
  .ranking li span:nth-child(2){overflow-wrap:anywhere}

  .change-nickname{margin-top:10px;border:0;background:none;text-decoration:underline;font-size:13px}
  main[data-compact]{gap:5px}

  main[data-compact] .score strong{font-size:18px}
  main[data-compact] .message{padding:8px}

<body>
<main id="game" aria-label="찍찍 치즈계단">
  <div class="hud">
    <div class="score"><span>최고 도달</span><strong id="score">0</strong><span>번째 치즈</span></div>
    <div id="wingLife" class="wing-life" role="status" aria-label="추가 목숨" hidden></div>
    <div class="actions">
      <button type="button" id="soundButton" class="icon" aria-label="소리 설정" title="소리 설정" aria-haspopup="dialog" aria-controls="soundSettings">🔊</button>
      <button type="button" id="fullscreen" class="icon" aria-label="전체 화면" title="전체 화면" hidden>⛶</button>
      <button type="button" id="pause" class="icon" aria-label="일시 정지" title="일시 정지" hidden>Ⅱ</button>
    </div>
  </div>
  <div class="stage"><canvas id="field" aria-label="생쥐가 치즈 계단을 올라가는 화면"></canvas></div>
  <div id="jumpHint" class="jump-hint" hidden>좌우 터치로 점프 · 공중에서는 방향 전환</div>
  <p id="cheeseTip" class="play-tip" role="status" hidden>위로 올라갈 수록 고급치즈가 나와요</p>
  <section id="message" class="message" aria-labelledby="title">
    <div class="message-content">
      <h1 id="title">찍찍 치즈계단</h1>
      <p id="description">벽에 닿으면 멈춰요.<br>좌우를 터치해 점프하고, 공중에서는 방향을 바꿔요.</p>
      <p id="refreshHint">게임화면이 잘린다면 새로고침🔄 해주세요</p>
      <form id="nicknameForm" class="nickname-form">
        <label id="nicknameLabel" for="nicknameInput">닉네임</label>
        <select id="nicknameSelect" hidden></select>
        <input id="nicknameInput" type="text" maxlength="16" placeholder="닉네임을 입력하세요" autocomplete="off" enterkeyhint="go">
        <p id="nicknameNote" class="form-note">이 브라우저에서 닉네임을 최대 3개까지 저장할 수 있어요.</p>
      </form>
      <section id="rankingPanel" class="ranking" aria-labelledby="rankingTitle" hidden>
        <h2 id="rankingTitle">치즈 랭킹 TOP 20</h2>
        <ol id="rankingList" aria-labelledby="rankingTitle" tabindex="0"></ol>
      </section>
      <p id="gameStatus" class="game-status" role="status" hidden></p>
    </div>
    <div class="message-actions">
      <button type="button" id="start" class="start">게임 시작</button>
      <button type="button" id="openRanking" class="ranking-action" aria-controls="rankingPanel">랭킹 보기</button>
      <button type="button" id="closeRanking" class="ranking-action" hidden>닉네임 입력으로 돌아가기</button>
    </div>
    <button type="button" id="changeNickname" class="change-nickname" hidden>닉네임 선택</button>
  </section>
  <dialog id="soundSettings" class="sound-settings" aria-labelledby="soundTitle">
    <h2 id="soundTitle">소리 설정</h2>
    <div class="sound-setting">
      <label for="musicVolume">배경음</label>
      <output for="musicVolume">40%</output>
      <input type="range" id="musicVolume" min="0" max="100" value="40">
    </div>
    <div class="sound-setting">
      <label for="effectsVolume">효과음</label>
      <output for="effectsVolume">100%</output>
      <input type="range" id="effectsVolume" min="0" max="100" value="100">
    </div>
    <form method="dialog"><button class="start" autofocus>닫기</button></form>
  </dialog>
</main>
<audio id="backgroundMusic" preload="none" src="./assets/background-music.mp3"></audio>

function nextCheesePhoto(level) {
  if (level <= LAST_STARTING_CHEDDAR_STEP) {
    return STARTING_CHEDDAR[Math.max(0, level - 1) % STARTING_CHEDDAR.length];
  }
  if (level <= LAST_STACKED_CHEDDAR_STEP) {
    return STACKED_CHEDDAR;
  }
  if (level <= LAST_BLOCK_CHEDDAR_STEP) {
    const index = level - LAST_STACKED_CHEDDAR_STEP - 1;
    return BLOCK_CHEDDAR[index % BLOCK_CHEDDAR.length];
  }
  if (level <= LAST_EMMENTAL_STEP) {
    if (!emmentalBag.length) emmentalBag = shuffledCheesePhotos(HOLEY_CHEESE);
    return emmentalBag.pop();
  }
  if (level <= LAST_GRUYERE_STEP) {
    return GRUYERE;
  }
  if (level <= LAST_BRIE_STEP) {
    return BRIE;
  }
  if (level <= LAST_AGED_GOUDA_STEP) {
    return AGED_GOUDA;
  }
  if (level <= LAST_CHEESE_TOWER_STEP) {
    return CHEESE_PILE;
  }
  if (!cheeseBag.length) cheeseBag = shuffledCheesePhotos(MIXED_CHEESE_PHOTOS);
  return cheeseBag.pop();
}

function shuffledCheesePhotos(photos) {
  const shuffled = photos.slice();
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function difficultyAt(step) {
  return 1 - Math.exp(-Math.max(0, step - VEST_STEP) / 55);
}

function lateDifficultyAt(step) {
  return 1 - Math.exp(-Math.max(0, step - VANISH_START_STEP) / 55);
}

function createPlatform(x, w, h, level, photo = nextCheesePhoto(level)) {
  const center = Math.max(w / 2, Math.min(WIDTH - w / 2, x));
  const imageHeight = w * photo.aspect;
  const imageTop = h + imageHeight * photo.surface;
  const note = cheeseNotes.find(note => note.photos.includes(photo));
  if (note && note.count++ % CHEESES_PER_NOTE === 0) {
    note.group = {lines: note.lines, shown: false};
  }
  return {x: center, w, h, level, photo, imageHeight, imageTop,
    noteGroup: note?.group};
}

function cheeseImagesOverlap(first, second) {
  const firstLeft = first.x - first.w / 2;
  const secondLeft = second.x - second.w / 2;
  const left = Math.max(firstLeft, secondLeft);
  const right = Math.min(firstLeft + first.w, secondLeft + second.w);
  const bottom = Math.max(first.imageTop - first.imageHeight, second.imageTop - second.imageHeight);
  const top = Math.min(first.imageTop, second.imageTop);
  if (right - left < 1e-7 || bottom >= top) return false;
  const firstMask = cheeseSilhouettes.get(first.photo.sprite);
  const secondMask = cheeseSilhouettes.get(second.photo.sprite);
  if (!firstMask || !secondMask) return true;

  // Test the visible cheese, including rotated photos, without counting transparent corners.
  const columns = Math.ceil(right - left);
  const rows = Math.ceil(top - bottom);
  const dx = (right - left) / columns;
  const dy = (top - bottom) / rows;
  for (let row = 0; row < rows; row++) {
    const elevation = top - (row + .5) * dy;
    const firstRow = Math.floor((first.imageTop - elevation) / first.imageHeight * SILHOUETTE_SIZE);
    const secondRow = Math.floor((second.imageTop - elevation) / second.imageHeight * SILHOUETTE_SIZE);
    for (let column = 0; column < columns; column++) {
      const x = left + (column + .5) * dx;
      const firstColumn = Math.floor((x - firstLeft) / first.w * SILHOUETTE_SIZE);
      const secondColumn = Math.floor((x - secondLeft) / second.w * SILHOUETTE_SIZE);
      const firstIndex = firstRow * SILHOUETTE_SIZE + firstColumn;
      const secondIndex = secondRow * SILHOUETTE_SIZE + secondColumn;
      if ((firstMask[firstIndex >> 3] & (1 << (firstIndex & 7))) &&
          (secondMask[secondIndex >> 3] & (1 << (secondIndex & 7)))) return true;
    }
  }
  return false;
}

function resizeCheese(cheese, width) {
  const factor = width / cheese.w;
  return {
    ...cheese, w: width,
    imageHeight: cheese.imageHeight * factor,
    imageTop: cheese.h + (cheese.imageTop - cheese.h) * factor,
  };
}

function makeCaptionSpace(platform, neighbors) {
  // Keep landing positions stable even when a nearby cheese needs space for a caption.
  const offsets = platform.extra ? [0, -18, 18, -30, 30] : [0];
  for (const offset of offsets) {
    const x = Math.max(platform.w / 2, Math.min(WIDTH - platform.w / 2, platform.x + offset));
    const candidate = {...platform, x};
    const touching = neighbors.filter(other => cheeseImagesOverlap(candidate, other));
    if (touching.some(other => other.noteLines)) continue;
    const adjusted = new Map(touching.map(other => [other, resizeCheese(other,
      Math.min(other.w, 132))]));
    if (neighbors.some(other => cheeseImagesOverlap(candidate, adjusted.get(other) || other))) continue;
    if ([...adjusted.entries()].some(([other, resized]) =>
      neighbors.some(captioned => captioned !== other && captioned.noteLines && cheeseImagesOverlap(resized, captioned)))) continue;
    Object.assign(platform, candidate);
    for (const [other, resized] of adjusted) Object.assign(other, resized);
    return true;
  }
  return false;
}

function addPlatforms() {
  while (lastHeight < camera + viewHeight + 2 * PLATFORM_IMAGE_REACH + 120) {
    const flight = flights[flightIndex];
    const step = flight[stepIndex++];
    level += 1;
    const stackedCheddar = level > LAST_STARTING_CHEDDAR_STEP && level <= LAST_STACKED_CHEDDAR_STEP;
    const extraGap = 8 + Math.max(0, Math.min(8, level - LAST_STACKED_CHEDDAR_STEP - 1));
    const gruyere = level > LAST_EMMENTAL_STEP && level <= LAST_GRUYERE_STEP;
    const maxGap = gruyere ? MAX_GRUYERE_STEP_GAP : MAX_STEP_GAP;
    const lateDifficulty = lateDifficultyAt(level);
    lastHeight += level === 2 || level === 3 ? SLICED_OVERLAP_GAP
      : stackedCheddar ? (level === 7 || level === 9 ? STACKED_OVERLAP_GAP
        : level === 8 || level === 10 ? STACKED_CLEAR_GAP : STACKED_CHEDDAR_GAP)
      : level >= 27 && level <= 29 ? BRIE_APPROACH_GAP
      : step.skipPair ? step.gap
      : Math.min(step.gap + extraGap, maxGap) + 8 * lateDifficulty;
    addStepPlatforms(step);
    if (stepIndex === flight.length) {
      stepIndex = 0;
      flightIndex = (flightIndex + 1) % flights.length;
    }
  }
  // New platforms are higher than lastHeight, but their images can extend below it.
  const settledImageTop = lastHeight - 1.5 * PLATFORM_IMAGE_REACH;
  for (const platform of platforms) {
    if (platform.vanished) continue;
    if (platform.noteLines === undefined && platform.imageTop <= settledImageTop) {
      const group = platform.noteGroup;
      platform.noteLines = null;
      if (!group || group.shown || platform.level - lastCaptionLevel < CAPTION_STEP_SPACING) continue;
      const neighbors = platforms.filter(other => other !== platform && !other.vanished);
      const fits = makeCaptionSpace(platform, neighbors);
      if (!fits) continue;
      platform.noteLines = group.lines;
      group.shown = true;
      lastCaptionLevel = platform.level;
    }
  }
}

function addStepPlatforms(step) {
  if (level > LAST_STARTING_CHEDDAR_STEP && level <= LAST_STACKED_CHEDDAR_STEP) {
    const x = (level === 7 || level === 9 ? .70 : level % 2 === 0 ? .66 : .34) * WIDTH;
    platforms.push(createPlatform(x, STACKED_CHEDDAR_WIDTH, lastHeight, level, STACKED_CHEDDAR));
    return;
  }

  const photo = nextCheesePhoto(level);
  const previousX = platforms.at(-1).x;
  const targetX = (level === 3 ? .35
    : level === LAST_STACKED_CHEDDAR_STEP + 1 ? .47
    : level === 27 ? .66 : level === 28 ? .47 : level === 29 ? .30 : step.x) * WIDTH
    + (Math.random() - .5) * 16;
  const x = Math.max(previousX - MAX_PLATFORM_SHIFT, Math.min(previousX + MAX_PLATFORM_SHIFT, targetX));
  const difficulty = difficultyAt(level);
  const lateDifficulty = lateDifficultyAt(level);
  const mainWidth = PLATFORM_WIDTH - (PLATFORM_WIDTH - MIN_PLATFORM_WIDTH) * difficulty - 14 * lateDifficulty;
  const extraWidth = EXTRA_PLATFORM_WIDTH - (EXTRA_PLATFORM_WIDTH - MIN_EXTRA_PLATFORM_WIDTH) * difficulty - 8 * lateDifficulty;
  const main = createPlatform(x, mainWidth, lastHeight, level, photo);
  const extra = step.extra;
  if (extra && photo !== STACKED_CHEDDAR &&
      (level <= VANISH_START_STEP || Math.random() >= lateDifficulty * .85)) {
    const extraPhoto = nextCheesePhoto(level);
    if (extraPhoto === STACKED_CHEDDAR) {
      // Save the stacked cheddar for the next step, where it can appear alone.
      cheeseBag.push(extraPhoto);
    } else {
      const extraX = Math.max(main.x - MAX_PLATFORM_SHIFT, Math.min(main.x + MAX_PLATFORM_SHIFT, extra.x * WIDTH));
      const side = createPlatform(extraX, extraWidth, lastHeight - extra.below, level, extraPhoto);
      side.extra = true;
      platforms.push(side);
    }
  }
  platforms.push(main);
}

function resize() {
  const box = canvas.getBoundingClientRect();
  if (!box.width || !box.height) return;
  const previousViewHeight = viewHeight;
  width = box.width;
  height = box.height;
  const ratio = Math.min(2.5, window.devicePixelRatio || 1);
  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(height * ratio);
  ctx.setTransform(ratio,0,0,ratio,0,0);
  // Leave room for the platform art on both sides of the playable lane.
  const padding = getComputedStyle(game);
  const left = mode === 'playing' ? parseFloat(padding.paddingLeft) : 0;
  const right = mode === 'playing' ? parseFloat(padding.paddingRight) : 0;
  const playWidth = Math.max(1, width - left - right);
  scale = Math.min(playWidth / (WIDTH + 24), height / 540, 1.85);
  offset = left + (playWidth - WIDTH * scale) / 2;
  viewHeight = height / scale;
  if (mode === 'ready' && player) {
    camera = START - viewHeight * .315;
    addPlatforms();
  } else if (previousViewHeight && (mode === 'playing' || mode === 'paused')) {
    const cameraShift = (previousViewHeight - viewHeight) * .43;
    camera += cameraShift;
    if (activeRescue) {
      activeRescue.cameraStart += cameraShift;
      activeRescue.cameraTarget += cameraShift;
    }
  }
}

function fitVisualViewport() {
  const viewport = window.visualViewport;
  if (viewport && Math.abs(viewport.scale - 1) > .01) return;
  const height = viewport?.height || window.innerHeight;
  game.style.setProperty('--viewport-height', `${height}px`);
  game.style.setProperty('--viewport-width', `${viewport?.width || window.innerWidth}px`);
  game.style.setProperty('--viewport-top', `${viewport?.pageTop || 0}px`);
  game.style.setProperty('--viewport-left', `${viewport?.pageLeft || 0}px`);
  game.toggleAttribute('data-compact', height < 490);
}

function setMode(next) {
  mode = next;
  game.dataset.mode = next;
  if (next !== 'playing') {
    backgroundMusic.pause();
    outfitRewardSource?.stop();
    outfitRewardSource = null;
  }
  message.hidden = next === 'playing';
  pause.hidden = next !== 'playing';
  jumpHint.hidden = next !== 'playing';
  refreshHint.hidden = next !== 'ready';
  updateCheeseTip();
  message.dataset.mode = next;
  message.setAttribute('aria-labelledby', next === 'ranking' ? 'rankingTitle' : 'title');
  nicknameForm.hidden = next !== 'ready';
  rankingPanel.hidden = next !== 'fallen' && next !== 'ranking';
  title.hidden = description.hidden = start.hidden = next === 'ranking';
  openRanking.hidden = next !== 'ready';
  closeRanking.hidden = next !== 'ranking';
  changeNickname.hidden = next !== 'fallen';
  setGameStatus('');
  if (next === 'ready') {
    title.textContent = '찍찍 치즈계단';
    description.replaceChildren('벽에 닿으면 멈춰요.', document.createElement('br'),
      '좌우를 터치해 점프하고, 공중에서는 방향을 바꿔요.');
    start.textContent = '게임 시작';
  } else if (next === 'paused') {
    title.textContent = '잠깐 쉬는 중';
    description.textContent = '이어서 치즈 계단을 올라가세요.';
    start.textContent = '계속하기';
  } else if (next === 'fallen') {
    title.textContent = '치즈에서 떨어졌어요.';
    description.textContent = '이번에 도달한 치즈 ' + best + '개';
    start.textContent = '다시 시작';
    void showFinalRanking(best);
  }
}

const rankingApi = document.querySelector('meta[name="cheese-ranking-api"]').content;
const rankingDeviceKey = 'cheese-stairs-ranking-device';
const lastNicknameKey = 'cheese-stairs-last-nickname';
let rankingDevice = crypto.randomUUID();
let activeNickname = '';
try {
  const savedDevice = localStorage.getItem(rankingDeviceKey);
  if (savedDevice && /^[a-f0-9-]{36}$/.test(savedDevice)) rankingDevice = savedDevice;
  else localStorage.setItem(rankingDeviceKey, rankingDevice);
  activeNickname = localStorage.getItem(lastNicknameKey) || '';
} catch {}
let currentRun = '';
let currentRunRegistration = null;
let runToken = 0;
let starting = false;

async function requestRanking(data, view = '') {
  if (!rankingApi) throw new Error('ranking_unavailable');
  const options = { cache: 'no-store', signal: AbortSignal.timeout(12000) };
  const url = new URL(rankingApi);
  if (view) url.search = view;
  else if (!data) url.searchParams.set('device', rankingDevice);
  if (data) {
    options.method = 'POST';
    options.headers = { 'Content-Type': 'application/json' };
    options.body = JSON.stringify({ ...data, device: rankingDevice });
  }
  const response = await fetch(url, options);
  const result = await response.json();
  if (!response.ok) throw new Error(result.error);
  return result;
}

function setGameStatus(text) {
  gameStatus.textContent = text;
  gameStatus.hidden = !text;
}

function updateNicknameField() {
  nicknameInput.hidden = !nicknameSelect.hidden && Boolean(nicknameSelect.value);
  nicknameLabel.htmlFor = nicknameSelect.hidden ? nicknameInput.id : nicknameSelect.id;
}

function showNicknames(nicknames) {
  nicknameSelect.replaceChildren(...nicknames.map(name => new Option(name, name)));
  if (nicknames.length > 0 && nicknames.length < MAX_SAVED_NICKNAMES) {
    nicknameSelect.add(new Option('새 닉네임 입력', ''));
  }
  nicknameSelect.hidden = nicknames.length === 0;
  if (nicknames.includes(activeNickname)) nicknameSelect.value = activeNickname;
  updateNicknameField();
}

nicknameSelect.addEventListener('change', () => {
  updateNicknameField();
  if (!nicknameInput.hidden) nicknameInput.focus();
});
nicknameForm.addEventListener('submit', event => {
  event.preventDefault();
  void startPlaying();
});
changeNickname.addEventListener('click', () => setMode('ready'));
requestRanking().then(({ nicknames }) => {
  if ((mode === 'ready' || mode === 'ranking') && !starting && !nicknameInput.value) showNicknames(nicknames);
}).catch(() => {});

function showRankingMessage(text) {
  const row = document.createElement('li');
  const note = document.createElement('p');
  note.textContent = text;
  row.append(note);
  rankingList.replaceChildren(row);
}

async function showFinalRanking(score) {
  showRankingMessage('순위를 불러오는 중…');
  const token = runToken;
  const canRender = () => mode === 'fallen' && runToken === token;
  let result;
  try {
    const id = currentRunRegistration ? await currentRunRegistration : currentRun;
    if (!canRender()) return;
    if (!id) throw new Error('ranking_unavailable');
    if (!score) result = await requestRanking(null, '?view=top');
    else result = await requestRanking({ action: 'finish', id, score });
  } catch {
    if (!canRender()) return;
    setGameStatus('이번 기록을 저장하지 못했어요.');
    try {
      result = await requestRanking(null, '?view=top');
    } catch {
      if (canRender()) showRankingMessage('순위를 불러오지 못했어요.');
      return;
    }
  }
  if (!canRender()) return;
  renderRanking(result.ranking);
}

function renderRanking(ranking) {
  if (!ranking.length) {
    showRankingMessage('아직 등록된 기록이 없어요.');
    return;
  }
  rankingList.replaceChildren(...ranking.slice(0, 20).map(({ nickname, score }, index) => {
    const row = document.createElement('li');
    const position = document.createElement('span');
    const name = document.createElement('span');
    const count = document.createElement('strong');
    position.textContent = String(index + 1);
    name.textContent = nickname;
    count.textContent = score + '개';
    row.append(position, name, count);
    return row;
  }));
  rankingList.closest('.message-content').scrollTop = 0;
}

let rankingView = 0;
openRanking.addEventListener('click', async () => {
  const view = ++rankingView;
  setMode('ranking');
  showRankingMessage('랭킹을 불러오는 중…');
  closeRanking.focus();
  try {
    const { ranking } = await requestRanking(null, '?view=top');
    if (mode === 'ranking' && view === rankingView) renderRanking(ranking);
  } catch {
    if (mode === 'ranking' && view === rankingView) showRankingMessage('랭킹을 불러오지 못했어요.');
  }
});
function returnToNickname() {
  setMode('ready');
  openRanking.focus();
}
closeRanking.addEventListener('click', returnToNickname);

async function registerRun(nickname, token) {
  try {
    const { id, nicknames } = await requestRanking({ action: 'start', nickname });
    if (token !== runToken) return '';
    activeNickname = nicknames.find(name => name.toLowerCase() ===
      nickname.normalize('NFKC').trim().replace(/ +/g, ' ').toLowerCase()) || nickname;
    try { localStorage.setItem(lastNicknameKey, activeNickname); } catch {}
    currentRun = id;
    showNicknames(nicknames);
    return id;
  } catch (error) {
    if (token !== runToken) return '';
    const errors = {
      invalid_nickname: '닉네임은 글자, 숫자, 공백, 밑줄, 하이픈으로 최대 16자까지 입력할 수 있어요.',
      nickname_limit: '이 브라우저에는 닉네임을 3개까지 저장할 수 있어요. 저장된 닉네임을 선택해 주세요.',
      nickname_taken: '이미 등록된 닉네임이에요. 다른 닉네임을 입력해 주세요.'
    };
    if (errors[error.message]) {
      setMode('ready');
      nicknameSelect.hidden = true;
      nicknameInput.hidden = false;
      nicknameInput.value = nickname;
      nicknameLabel.htmlFor = nicknameInput.id;
      setGameStatus(errors[error.message]);
      nicknameInput.focus();
      if (error.message === 'nickname_limit') {
        requestRanking().then(({ nicknames }) => showNicknames(nicknames)).catch(() => {});
      }
    }
    return '';
  }
}

function prepareBackgroundMusic() {
  if (backgroundMusic.readyState >= HTMLMediaElement.HAVE_METADATA) {
    backgroundMusic.currentTime = MUSIC_START_TIME;
  } else {
    backgroundMusic.addEventListener('loadedmetadata', () => {
      backgroundMusic.currentTime = MUSIC_START_TIME;
    }, {once: true});
  }
}

function startPlaying() {
  if (mode === 'playing' || mode === 'ranking' || starting) return;
  if (mode !== 'paused') {
    const nickname = mode === 'fallen' ? activeNickname :
      (nicknameInput.hidden ? nicknameSelect.value : nicknameInput.value.trim());
    if (!nickname) {
      setGameStatus('닉네임을 입력해 주세요.');
      nicknameInput.focus();
      return;
    }
    if (!/^[\p{L}\p{N}_ -]{1,16}$/u.test(nickname.normalize('NFKC').trim())) {
      setGameStatus('닉네임은 글자, 숫자, 공백, 밑줄, 하이픈으로 최대 16자까지 입력할 수 있어요.');
      nicknameInput.focus();
      return;
    }
    starting = true;
    try {
      unlockAudio();
      prepareBackgroundMusic();
      activeNickname = nickname;
      currentRun = '';
      const token = ++runToken;
      reset();
      start.blur();
      setMode('playing');
      playBackgroundMusic();
      currentRunRegistration = registerRun(nickname, token);
    } finally {
      starting = false;
    }
    return;
  }
  unlockAudio();
  start.blur();
  setMode('playing');
  playBackgroundMusic();
}

function playBackgroundMusic() {
  backgroundMusic.play().catch(() => {});
}

function applySoundLevels() {
  const musicLevel = musicVolume.valueAsNumber / 100;
  const effectsLevel = effectsVolume.valueAsNumber / 100;
  // Media-element volume can be ignored on mobile Safari. Use Web Audio when available.
  if (musicGain) musicGain.gain.value = musicLevel;
  backgroundMusic.volume = musicGain ? 1 : musicLevel;
  backgroundMusic.muted = musicLevel === 0;
  if (effectsGain) effectsGain.gain.value = effectsLevel;

  for (const control of [musicVolume, effectsVolume]) {
    control.parentElement.querySelector('output').value = control.value + '%';
  }
  soundButton.textContent = musicLevel === 0 && effectsLevel === 0 ? '🔇' : '🔊';
}

for (const control of [musicVolume, effectsVolume]) {
  const key = 'cheese-stairs-' + control.id;
  try {
    const saved = localStorage.getItem(key);
    if (saved !== null && /^\d{1,3}$/.test(saved)) control.value = saved;
  } catch {}
  control.addEventListener('input', () => {
    applySoundLevels();
    try { localStorage.setItem(key, control.value); } catch {}
  });
}
applySoundLevels();
soundButton.addEventListener('click', () => soundSettings.showModal());

backgroundMusic.addEventListener('ended', () => {
  backgroundMusic.currentTime = MUSIC_START_TIME;
  if (mode === 'playing') playBackgroundMusic();
});

function standingOn(platform, x) {
  return !platform.vanished && Math.abs(x - platform.x) <= platform.w / 2 - SOLE_INSET + FOOT_HALF_WIDTH;
}

function scheduleCheeseVanish(platform, delay = CHEESE_VANISH_DELAY) {
  if (platform.level >= VANISH_START_STEP && platform.vanishAt === undefined) {
    platform.vanishAt = elapsed + delay;
  }
}

function dust(x,h,amount,color) {
  for (let i=0;i<amount;i++) {
    sparks.push({x,h,vx:(Math.random()-.5)*106,vy:24+Math.random()*80,
      size:2+Math.random()*3,life:.32,max:.32,color});
  }
}

function requestJump(direction) {
  if (activeRescue || elapsed < rescueRecoveryUntil) return;
  unlockAudio();
  if (player.push > 0 || (!player.ground && player.coyote === 0)) {
    player.dir = direction;
    return;
  }
  player.jumpDir = direction;
  player.buffer = .14;
}

function unlockAudio() {
  const AudioContextType = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextType) return;
  if (!audioContext) {
    audioContext = new AudioContextType();
    effectsGain = audioContext.createGain();
    effectsGain.connect(audioContext.destination);
    outfitRewardBuffer = fetch(sources.vestReward)
      .then(response => response.arrayBuffer())
      .then(bytes => audioContext.decodeAudioData(bytes))
      .catch(() => null);
    try {
      const source = audioContext.createMediaElementSource(backgroundMusic);
      const gain = audioContext.createGain();
      source.connect(gain).connect(audioContext.destination);
      musicGain = gain;
    } catch {}
    applySoundLevels();
  }
  if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
}

async function playOutfitReward() {
  if (!outfitRewardBuffer || effectsVolume.valueAsNumber === 0) return;
  const started = rewardGlowStarted;
  const buffer = await outfitRewardBuffer;
  if (!buffer || mode !== 'playing' || started !== rewardGlowStarted ||
      elapsed - started >= REWARD_GLOW_DURATION || audioContext.state !== 'running') return;
  const source = audioContext.createBufferSource();
  source.buffer = buffer;
  source.connect(effectsGain);
  source.onended = () => {
    if (outfitRewardSource === source) outfitRewardSource = null;
  };
  outfitRewardSource = source;
  source.start();
}

function playJumpSound() {
  if (audioContext?.state !== 'running' || effectsVolume.valueAsNumber === 0) return;
  const time = audioContext.currentTime;
  const tone = audioContext.createOscillator();
  const spring = audioContext.createOscillator();
  const springVolume = audioContext.createGain();
  const volume = audioContext.createGain();

  tone.type = 'triangle';
  tone.frequency.setValueAtTime(260, time);
  tone.frequency.exponentialRampToValueAtTime(760, time + .075);
  tone.frequency.exponentialRampToValueAtTime(420, time + .27);

  spring.type = 'sine';
  spring.frequency.setValueAtTime(28, time);
  spring.frequency.exponentialRampToValueAtTime(11, time + .24);
  springVolume.gain.setValueAtTime(65, time);
  springVolume.gain.exponentialRampToValueAtTime(4, time + .24);
  spring.connect(springVolume).connect(tone.frequency);

  volume.gain.setValueAtTime(.001, time);
  volume.gain.exponentialRampToValueAtTime(.58, time + .017);
  volume.gain.exponentialRampToValueAtTime(.40, time + .085);
  volume.gain.exponentialRampToValueAtTime(.001, time + .29);
  tone.connect(volume).connect(effectsGain);
  tone.start(time);
  spring.start(time);
  tone.stop(time + .30);
  spring.stop(time + .30);
}

function updateCheeseTip() {
  if (mode === 'playing' && elapsed >= cheesePopupUntil && (activeCheesePopup || pendingCheesePopups.length)) {
    activeCheesePopup = pendingCheesePopups.shift() ?? null;
    if (activeCheesePopup) cheesePopupUntil = elapsed + activeCheesePopup.duration;
  }
  const text = activeCheesePopup?.text ?? '';
  if (cheeseTip.textContent !== text) cheeseTip.textContent = text;
  cheeseTip.hidden = mode !== 'playing' || !activeCheesePopup;
}

function reachCheese(step) {
  if (step <= best) return;
  for (const popup of CHEESE_POPUPS) {
    if (best < popup.step && step >= popup.step) pendingCheesePopups.push(popup);
  }
  const earnedHat = best < HAT_STEP && step >= HAT_STEP;
  if (best < VEST_STEP && step >= VEST_STEP) {
    wingLifeAvailable = true;
  }
  if (earnedHat) hatLifeAvailable = true;
  updateBonusLives();
  if (earnedHat || (best < VEST_STEP && step >= VEST_STEP)) {
    rewardGlowStarted = elapsed;
    void playOutfitReward();
    dust(player.x, player.h + (earnedHat ? 70 : 31), 12, '#fff4a8');
  }
  best = step;
  score.textContent = String(best);
  updateCheeseTip();
}

function canJumpToUpperCheese(from, to) {
  if (to.level <= from.level || to.vanished || to.vanishAt !== undefined) return false;
  const rise = to.h - from.h;
  const remainingSpeed = JUMP_SPEED ** 2 - 2 * GRAVITY * rise;
  if (rise <= 0 || remainingSpeed <= 0) return false;
  const flightTime = PUSH_TIME + (JUMP_SPEED + Math.sqrt(remainingSpeed)) / GRAVITY;
  const landingHalfWidth = to.w / 2 - SOLE_INSET + FOOT_HALF_WIDTH;
  const horizontalDistance = Math.max(0, Math.abs(to.x - from.x) - landingHalfWidth);
  return horizontalDistance <= SPEED * flightTime - 8;
}

function findRescuePlatform() {
  const origin = lastSafePlatform || player;
  const remaining = platforms.filter(platform => !platform.vanished &&
    (platform.vanishAt === undefined || platform.vanishAt > elapsed + CHEESE_POP_DURATION));
  const jumpable = remaining.filter(platform => remaining.some(upper =>
    canJumpToUpperCheese(platform, upper)));
  if (lastSafePlatform && jumpable.includes(lastSafePlatform)) return lastSafePlatform;
  return jumpable.reduce((closest, platform) => {
    const distance = Math.abs(platform.h - origin.h) + Math.abs(platform.x - origin.x) * .15;
    const closestDistance = closest &&
      Math.abs(closest.h - origin.h) + Math.abs(closest.x - origin.x) * .15;
    return !closest || distance < closestDistance ? platform : closest;
  }, null);
}

function startRescue(kind) {
  const target = findRescuePlatform();
  if (!target) {
    setMode('fallen');
    return;
  }
  const wearingVest = !vestConsumed && best >= VEST_STEP;
  if (kind === 'propeller') {
    hatLifeAvailable = false;
    hatConsumed = true;
  } else {
    wingLifeAvailable = false;
    vestConsumed = true;
  }
  updateBonusLives();
  if (target.vanishAt !== undefined) {
    const duration = kind === 'propeller' ? PROPELLER_RESCUE_DURATION : WING_RESCUE_DURATION;
    target.vanishAt = Math.max(target.vanishAt,
      elapsed + duration + WING_RECOVERY_DURATION + CHEESE_VANISH_DELAY);
  }
  const targetScreenY = screenY(target.h);
  const cameraTarget = targetScreenY < viewHeight * .26 || targetScreenY > viewHeight * .68
    ? target.h - viewHeight * .43 : camera;
  player.ground = null;
  player.vy = player.push = player.coyote = player.buffer = 0;
  activeRescue = {kind, wearingVest, target, x: player.x, h: player.h,
    cameraStart: camera, cameraTarget, time: 0};
  activeCheesePopup = {text: kind === 'propeller' ? '치즈 프로펠러다!!' : '치즈날개다!!', duration: 1.5};
  cheesePopupUntil = elapsed + activeCheesePopup.duration;
  updateCheeseTip();
}

function updateRescue(dt) {
  activeRescue.time += dt;
  const duration = activeRescue.kind === 'propeller' ? PROPELLER_RESCUE_DURATION : WING_RESCUE_DURATION;
  const progress = Math.min(1, activeRescue.time / duration);
  const lift = progress * progress * (3 - 2 * progress);
  const propeller = activeRescue.kind === 'propeller';
  const arc = propeller ? Math.sin(Math.PI * progress) : 0;
  const middleX = (activeRescue.x + activeRescue.target.x) / 2;
  player.x = activeRescue.x + (activeRescue.target.x - activeRescue.x) * lift
    + arc * (WIDTH / 2 - middleX) * .8;
  player.h = activeRescue.h + (activeRescue.target.h - activeRescue.h) * lift + arc * 28;
  const cameraProgress = propeller ? Math.max(0, (progress - .08) / .92) : progress;
  const cameraLift = cameraProgress * cameraProgress * (3 - 2 * cameraProgress);
  camera = activeRescue.cameraStart + (activeRescue.cameraTarget - activeRescue.cameraStart) * cameraLift;
  if (progress === 1) {
    player.x = activeRescue.target.x;
    player.h = activeRescue.target.h;
    player.ground = activeRescue.target;
    lastSafePlatform = activeRescue.target;
    player.vy = player.air = player.coyote = player.buffer = 0;
    rescueRecoveryUntil = elapsed + WING_RECOVERY_DURATION;
    scheduleCheeseVanish(activeRescue.target, WING_RECOVERY_DURATION + CHEESE_VANISH_DELAY);
    reachCheese(activeRescue.target.level);
    dust(player.x, player.h, 10, '#fff0ad');
    activeRescue = null;
  }
}

function hasReachableLanding() {
  // Keep the run alive while any lower cheese is still reachable by turning in midair.
  for (const platform of platforms) {
    if (platform.vanished) continue;
    const drop = player.h - platform.h;
    if (drop <= 0 || platform.h <= camera - FALL_MARGIN) continue;
    const time = (player.vy + Math.sqrt(player.vy ** 2 + 2 * GRAVITY * drop)) / GRAVITY;
    const travel = SPEED * time;
    const halfWidth = platform.w / 2 - SOLE_INSET + FOOT_HALF_WIDTH;
    if (player.x - travel <= platform.x + halfWidth &&
        player.x + travel >= platform.x - halfWidth) return true;
  }
  return false;
}

function update(dt) {
  elapsed += dt;
  updateCheeseTip();
  if (activeRescue) {
    updateRescue(dt);
    return;
  }
  if (elapsed < rescueRecoveryUntil) return;
  for (const platform of platforms) {
    if (platform.vanishAt !== undefined && elapsed >= platform.vanishAt && !platform.vanished) {
      platform.vanished = true;
      dust(platform.x, platform.h, 9, '#fff0ad');
    }
  }
  player.buffer = Math.max(0, player.buffer - dt);
  if (player.buffer > 0 && !player.push && (player.ground || player.coyote > 0)) {
    player.buffer = 0;
    player.dir = player.jumpDir;
    player.push = PUSH_TIME;
  }
  const oldX = player.x;
  const oldHeight = player.h;
  const nextX = Math.max(EDGE, Math.min(WIDTH - EDGE, oldX + player.dir * SPEED * dt));
  player.x = nextX;
  if (player.ground && !player.push) {
    player.runDistance = (player.runDistance + Math.abs(nextX - oldX)) % RUN_CYCLE_DISTANCE;
  }

  let steppedOff = null;
  if (player.ground && !standingOn(player.ground,nextX) && !player.push) {
    steppedOff = player.ground;
    player.ground = platforms.find(platform => platform.h === player.h && standingOn(platform,nextX)) || null;
    if (!player.ground) {
      player.coyote = .085;
      player.air = 0;
    }
  }
  if (player.push > 0) {
    player.push -= dt;
    if (player.push <= 0) {
      player.push = 0;
      player.ground = null;
      player.coyote = 0;
      player.air = 0;
      player.vy = JUMP_SPEED;
      playJumpSound();
      dust(nextX,player.h,7,'#fff0ad');
    }
  }
  if (!player.ground && !player.push) {
    player.coyote = Math.max(0,player.coyote - dt);
    player.air += dt;
    player.vy -= GRAVITY * dt;
    player.h += player.vy * dt;
    if (player.vy <= 0) {
      let landing = null;
      for (const platform of platforms) {
        if (platform === steppedOff) continue;
        if (oldHeight < platform.h || player.h > platform.h) continue;
        const progress = (oldHeight - platform.h) / (oldHeight - player.h || 1);
        const crossX = oldX + (nextX - oldX) * progress;
        if (standingOn(platform,crossX) &&
            (!landing || platform.h > landing.h)) landing = platform;
      }
      if (landing) {
        const halfWidth = landing.w / 2 - SOLE_INSET + FOOT_HALF_WIDTH;
        player.x = Math.max(EDGE, Math.min(WIDTH - EDGE,
          Math.max(landing.x - halfWidth, Math.min(landing.x + halfWidth, nextX))));
        player.h = landing.h;
        player.ground = landing;
        lastSafePlatform = landing;
        player.vy = player.air = player.coyote = 0;
        dust(player.x,landing.h,5,'#fff0ad');
        scheduleCheeseVanish(landing);
        reachCheese(landing.level);
      }
    }
  }

  const target = player.h - viewHeight * .43;
  const scrollSpeed = CAMERA_SPEED + (MAX_CAMERA_SPEED - CAMERA_SPEED) * difficultyAt(best)
    + 12 * lateDifficultyAt(best);
  camera = Math.max(camera + scrollSpeed * dt, camera + (target - camera) * Math.min(dt * 5.5,1));
  addPlatforms();
  while (platforms.length && platforms[0].h < camera - 240) platforms.shift();
  for (const spark of sparks) {
    spark.x += spark.vx * dt;
    spark.h += spark.vy * dt;
    spark.vy -= 220 * dt;
    spark.life -= dt;
  }
  sparks = sparks.filter(spark => spark.life > 0);
  // Show the fall near the bottom of the screen before ending a run with no possible landing.
  const fallIsCertain = player.h < camera - FALL_MARGIN ||
    (screenY(player.h) >= viewHeight * EARLY_FALL_SCREEN_RATIO &&
      !player.ground && !player.push && player.coyote === 0 && player.vy < 0 &&
      !hasReachableLanding());
  if (fallIsCertain) {
    if (hatLifeAvailable) startRescue('propeller');
    else if (wingLifeAvailable) startRescue('wing');
    else setMode('fallen');
  }
}

function sky() {
  ctx.clearRect(0,0,width,height);

  const glow = ctx.createRadialGradient(width*.75,height*.72,0,width*.75,height*.72,Math.max(width,height)*.66);
  glow.addColorStop(0,'#ffebbc72');
  glow.addColorStop(.58,'#bce8ed24');
  glow.addColorStop(1,'#8bcbea00');
  ctx.fillStyle = glow;
  ctx.fillRect(0,0,width,height);

  for (let i=0;i<9;i++) {
    const depth = i%2;
    const cloudWidth = Math.min(width*.32,195)*(1+i%3*.22);
    const x = width*((i*29+3)%100)/100 + Math.sin(elapsed*.19+i)*12;
    const y = (((i*79+25)%389)/389*(height+200)+camera*scale*(depth ? .46 : .29))%(height+200)-85;
    cloud(x,y,cloudWidth,depth ? '#f1fbff35' : '#e0f6ff24');
  }
}

function cloud(x,y,w,color) {
  const h = w*.24;
  ctx.beginPath();
  ctx.ellipse(x,y,w*.53,h*.56,0,0,Math.PI*2);
  ctx.ellipse(x-w*.18,y-h*.24,w*.25,h*.66,0,0,Math.PI*2);
  ctx.ellipse(x+w*.04,y-h*.43,w*.30,h*.82,0,0,Math.PI*2);
  ctx.ellipse(x+w*.31,y-h*.18,w*.19,h*.54,0,0,Math.PI*2);
  ctx.fillStyle = color;
  ctx.fill();
}

function screenY(h) {
  return viewHeight - h + camera;
}

function drawPlatform(platform) {
  const {photo} = platform;
  const image = art[photo.sprite];
  const x = platform.x - platform.w / 2;
  const h = platform.imageHeight;
  const top = screenY(platform.imageTop);
  if (photo.rotated) {
    ctx.save();
    ctx.translate(platform.x, top + h / 2);
    ctx.rotate(Math.PI / 2);
    ctx.drawImage(image,-h / 2,-platform.w / 2,h,platform.w);
    ctx.restore();
  } else {
    ctx.drawImage(image,x,top,platform.w,h);
  }
}

function drawPoppingPlatform(platform, draw) {
  const progress = platform.vanishAt === undefined ? 0
    : Math.max(0, Math.min(1,
      (elapsed - platform.vanishAt + CHEESE_POP_DURATION) / CHEESE_POP_DURATION));
  if (progress === 0) {
    draw();
    return;
  }
  const centerY = screenY(platform.imageTop) + platform.imageHeight / 2;
  const size = 1 - progress * .85;
  ctx.save();
  ctx.globalAlpha *= 1 - progress;
  ctx.translate(platform.x, centerY);
  ctx.scale(size, size);
  ctx.translate(-platform.x, -centerY);
  draw();
  ctx.restore();
}

function drawCheeseNote(lines, x, y, cheeseWidth, cheeseHeight) {
  const fontSize = Math.min(22, cheeseWidth / 8.5, (cheeseHeight - 10) / (lines.length * 1.18));
  const lineHeight = fontSize * 1.18;
  const firstLineY = y - (lines.length - 1) * lineHeight / 2;
  ctx.save();
  ctx.font = `650 ${fontSize}px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#422410';
  lines.forEach((line, index) => {
    const lineY = firstLineY + index * lineHeight;
    ctx.fillText(line, x, lineY, cheeseWidth - 16);
  });
  ctx.restore();
}

function drawMouse(now) {
  const airborne = !player.ground && !player.push;
  const stoppedAtWall = player.dir < 0 ? player.x <= EDGE : player.x >= WIDTH - EDGE;
  const recovering = mode === 'playing' && elapsed < rescueRecoveryUntil;
  const walking = mode === 'playing' && player.ground && !player.push && !stoppedAtWall && !recovering;
  const resting = mode === 'ready' || mode === 'paused' || (player.ground && !player.push && stoppedAtWall);
  const bounce = recovering
    ? 4.5 * Math.sin((rescueRecoveryUntil - elapsed) * Math.PI * 2.5) ** 2
    : walking
    ? 2.7 * Math.sin(2 * Math.PI * player.runDistance / RUN_CYCLE_DISTANCE) ** 2
    : resting ? 1.8 * (.5 - .5 * Math.cos(now * .009)) : 0;
  const y = screenY(player.h) - bounce;
  ctx.save();
  ctx.translate(player.x,y);
  const runFrame = walking ? Math.floor(player.runDistance * WALK_FRAMES.length / RUN_CYCLE_DISTANCE) : -1;
  const rescueDrawn = activeRescue && drawRescueMouse();
  if (!rescueDrawn) {
    if (vestConsumed && best >= HAT_STEP && !hatConsumed && mode === 'playing') {
      const progress = (elapsed - rewardGlowStarted) / REWARD_GLOW_DURATION;
      if (progress >= 0 && progress < 1) drawRewardSunburst(progress, -70);
    }
    if (vestConsumed && best >= HAT_STEP && !hatConsumed && art.hatOnlyMouse) {
      drawHatOnlyMouse(player.push > 0 ? .94 : 1);
    } else if (best >= VEST_STEP && !vestConsumed && art.rewardMouse) {
      drawOutfitMouse(runFrame, airborne);
    } else if (player.push > 0) {
      const pushing = player.push < PUSH_TIME*.65;
      drawPose(art[pushing ? 'jumpPush':'jumpReady'], -player.dir, 0, pushing ? 1.07 : .89);
    } else if (airborne) {
      drawPose(art[player.vy > 480 && player.air < .11 ? 'jumpPush' : 'jumpOpen'], -player.dir, 0, 1);
    } else {
      drawRun(runFrame);
    }
  }
  ctx.restore();
}

function drawRescueMouse() {
  if (activeRescue.kind === 'propeller') return drawPropellerMouse();
  const pair = best >= HAT_STEP && !hatConsumed ? 2 : 0;
  const flap = Math.floor(activeRescue.time * 16) % 2;
  const frame = wingFrames[pair + flap] || wingFrames[pair + 1 - flap];
  if (!frame) return false;
  const h = 76;
  const w = h * frame.width / frame.height;
  ctx.save();
  ctx.scale(-player.dir, 1);
  ctx.imageSmoothingEnabled = false;
  const progress = (elapsed - rewardGlowStarted) / REWARD_GLOW_DURATION;
  if (mode === 'playing' && progress >= 0 && progress < 1) {
    drawRewardSunburst(progress, pair ? -70 : -33);
  }
  const x = -w * .6;
  ctx.drawImage(frame.image, x, -h, w, h);
  ctx.restore();
  return true;
}

function drawPropellerMouse() {
  const pair = activeRescue.wearingVest ? 2 : 0;
  const spin = Math.floor(activeRescue.time * 20) % 2;
  const frame = propellerFrames[pair + spin] || propellerFrames[pair + 1 - spin];
  if (!frame) return false;
  const pixels = 76 / 510;
  const w = frame.width * pixels;
  const h = frame.height * pixels;
  const x = (frame.sourceX - 1330) * pixels;
  const y = (frame.sourceY - 2301) * pixels;
  const left = player.dir < 0 ? player.x + x : player.x - x - w;
  const right = left + w;
  const visibleLeft = -offset / scale + 2;
  const visibleRight = (width - offset) / scale - 2;
  const shift = left < visibleLeft ? visibleLeft - left : right > visibleRight ? visibleRight - right : 0;
  ctx.save();
  ctx.translate(shift, 0);
  ctx.scale(-player.dir, 1);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(frame.image, x, y, w, h);
  ctx.restore();
  return true;
}

function drawHatOnlyMouse(stretch) {
  const {x, y, w, h, anchorX, anchorY} = HAT_ONLY_SOURCE;
  const pixels = 76 / h;
  ctx.save();
  ctx.scale(-player.dir, stretch);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(art.hatOnlyMouse, x, y, w, h,
    (x - anchorX) * pixels, (y - anchorY) * pixels, w * pixels, h * pixels);
  ctx.restore();
}

function drawOutfitMouse(runFrame, airborne) {
  const wearingHat = best >= HAT_STEP && !hatConsumed;
  const outfit = wearingHat ? OUTFIT_SPRITES.hatAndVest : OUTFIT_SPRITES.vest;
  let frame = runFrame < 0 ? outfit.stand : outfit.run[runFrame];
  let stretch = 1;
  if (player.push > 0) {
    const pushing = player.push < PUSH_TIME * .65;
    frame = pushing ? outfit.jump : outfit.push;
    stretch = pushing ? 1.07 : .89;
  } else if (airborne) {
    frame = outfit.jump;
  }
  const frameWidth = OUTFIT_FRAME_WIDTH;
  const frameHeight = OUTFIT_FRAME_HEIGHT;
  const pixels = 76 / WALK_SPRITE_HEIGHT;
  ctx.save();
  ctx.scale(-player.dir, stretch);
  ctx.imageSmoothingEnabled = false;
  const sourceX = frame % 3 * frameWidth;
  const sourceY = Math.floor(frame / 3) * frameHeight;
  const x = -OUTFIT_FRAME_ANCHOR.x * pixels;
  const y = -OUTFIT_FRAME_ANCHOR.y * pixels;
  const w = frameWidth * pixels;
  const h = frameHeight * pixels;
  const progress = (elapsed - rewardGlowStarted) / REWARD_GLOW_DURATION;
  if (mode === 'playing' && progress >= 0 && progress < 1) {
    drawRewardSunburst(progress, wearingHat ? -70 : -33);
  }
  ctx.drawImage(art.rewardMouse, sourceX, sourceY, frameWidth, frameHeight, x, y, w, h);
  ctx.restore();
}

function drawRewardSunburst(progress, centerY) {
  const spread = Math.min(1, progress * 4.5);
  const opacity = Math.min(1, (1 - progress) * 2.6);
  const radius = 30 + 78 * (1 - (1 - spread) ** 2);
  const rayCount = 12;
  ctx.save();
  ctx.translate(-3, centerY);
  ctx.globalAlpha = opacity;
  const sunlight = ctx.createRadialGradient(0, 0, 9, 0, 0, radius);
  sunlight.addColorStop(0, '#fffdf0');
  sunlight.addColorStop(.45, '#fff0a6');
  sunlight.addColorStop(.78, 'rgba(255, 217, 103, .8)');
  sunlight.addColorStop(1, 'rgba(255, 217, 103, 0)');
  ctx.fillStyle = sunlight;

  for (let i = 0; i < rayCount; i++) {
    const angle = i * 2 * Math.PI / rayCount - Math.PI / 2 + spread * .18;
    const length = radius * (i % 2 === 0 ? 1 : .73);
    const halfWidth = i % 2 === 0 ? .082 : .054;
    ctx.beginPath();
    ctx.moveTo(Math.cos(angle) * 12, Math.sin(angle) * 12);
    ctx.lineTo(Math.cos(angle - halfWidth) * length, Math.sin(angle - halfWidth) * length);
    ctx.lineTo(Math.cos(angle + halfWidth) * length, Math.sin(angle + halfWidth) * length);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawPose(image,orientation,bounce,stretch) {
  if (!image) return;
  const height = 78 * stretch;
  const width = height / stretch * image.naturalWidth / image.naturalHeight;
  ctx.save();
  ctx.scale(orientation,1);
  ctx.drawImage(image,-width*.64,-height-bounce,width,height);
  ctx.restore();
}

function drawRun(runFrame) {
  const frame = runFrame < 0 ? STANDING_FRAME : WALK_FRAMES[runFrame];
  const image = art[frame.sprite] || art.walk;
  if (!image) return;
  const origin = art[frame.sprite] ? frame : STANDING_FRAME;
  const pixels = 76 / WALK_SPRITE_HEIGHT;
  ctx.save();
  ctx.scale(-player.dir, 1);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(image, -origin.x * pixels, -origin.y * pixels,
    image.naturalWidth * pixels, image.naturalHeight * pixels);
  ctx.restore();
}

function render(now) {
  if (!width || !height) return;
  sky();
  ctx.save();
  ctx.translate(offset,0);
  ctx.scale(scale,scale);
  const visiblePlatforms = platforms.filter(platform => {
    const y = screenY(platform.h);
    return !platform.vanished && art[platform.photo.sprite] && y >= -170 && y <= viewHeight + 135;
  });
  for (const platform of visiblePlatforms) {
    drawPoppingPlatform(platform, () => drawPlatform(platform));
  }

  // Draw captions after the cheese images so a neighboring cheese cannot cover them.
  for (const platform of visiblePlatforms) {
    const {noteLines, x, w, imageTop, imageHeight} = platform;
    if (noteLines) drawPoppingPlatform(platform,
      () => drawCheeseNote(noteLines, x, screenY(imageTop) + imageHeight / 2, w, imageHeight));
  }
  for (const spark of sparks) {
    ctx.globalAlpha = spark.life / spark.max;
    ctx.fillStyle = spark.color;
    ctx.beginPath();
    ctx.arc(spark.x,screenY(spark.h),spark.size,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawMouse(now);
  ctx.restore();
}

game.addEventListener('pointerdown', event => {
  if (mode !== 'playing' || soundSettings.open || event.target.closest('button') ||
      (event.pointerType === 'mouse' && event.button !== 0)) return;
  event.preventDefault();
  const bounds = canvas.getBoundingClientRect();
  requestJump(event.clientX < bounds.left + offset + WIDTH * scale / 2 ? -1 : 1);
});
canvas.addEventListener('contextmenu',event=>event.preventDefault());
start.addEventListener('click',startPlaying);
pause.addEventListener('click',()=>setMode('paused'));
document.addEventListener('keydown',event=>{
  if (soundSettings.open) return;
  if (!['Space','Escape','Enter'].includes(event.code)) return;
  if (mode === 'ranking' && event.code === 'Escape') {
    event.preventDefault();
    returnToNickname();
    return;
  }
  if (event.target instanceof Element && event.target.closest('button,input,select,[tabindex]')) return;
  event.preventDefault();
  if (event.repeat) return;
  if (mode !== 'playing') {
    if (event.code==='Enter' || event.code==='Space') startPlaying();
    return;
  }
  if (event.code === 'Escape') setMode('paused');
  if (event.code === 'Space') requestJump(player.dir);
});
document.addEventListener('visibilitychange',()=>{
  if (document.hidden && mode==='playing') setMode('paused');
});
if (game.requestFullscreen && document.fullscreenEnabled) {
  fullscreen.hidden=false;
  fullscreen.addEventListener('click',async ()=>{
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await game.requestFullscreen();
    } catch {
      fullscreen.hidden=true;
    }
  });
  document.addEventListener('fullscreenchange',()=>{
    const label=document.fullscreenElement ? '전체 화면 닫기':'전체 화면';
    fullscreen.setAttribute('aria-label',label);
    fullscreen.title=label;
  });
}
window.visualViewport?.addEventListener('resize', fitVisualViewport);
window.visualViewport?.addEventListener('scroll', fitVisualViewport);
window.addEventListener('resize', fitVisualViewport);
fitVisualViewport();
new ResizeObserver(resize).observe(canvas);
resize();
reset();

sources.walk = './assets/walk.png';
sources.walkStepA = './assets/walkStepA.png';
sources.walkStepB = './assets/walkStepB.png';
sources.rewardMouse = './reward-mouse.png?v=76';
sources.hatOnlyMouse = './hat-only-mouse.png?v=91';
sources.vestReward = './vest-reward.mp3';
for (const [name,src] of Object.entries(sources)) {
  if (name === 'vestReward') continue;
  const image = new Image();
  image.onload = () => {art[name] = image;};
  image.src = src;
}
async function loadRescueSprites(sprites, frames) {
  for (const [index, {src, crop}] of sprites.entries()) {
    const image = new Image();
    try {
      await new Promise((resolve, reject) => {
        image.onload = resolve;
        image.onerror = reject;
        image.src = src;
      });
      const [sx, sy, width, height] = crop;
      let sprite = null;
      try {
        if (typeof createImageBitmap === 'function') sprite = await createImageBitmap(image, ...crop);
      } catch {}
      if (!sprite) {
        const buffer = document.createElement('canvas');
        buffer.width = width;
        buffer.height = height;
        buffer.getContext('2d').drawImage(image, sx, sy, width, height, 0, 0, width, height);
        sprite = buffer;
      }
      frames[index] = {image: sprite, width, height, sourceX: sx, sourceY: sy};
    } catch {}
    image.onload = image.onerror = null;
  }
}
void (async () => {
  await loadRescueSprites(WING_SPRITES, wingFrames);
  await loadRescueSprites(PROPELLER_SPRITES, propellerFrames);
})();

let previous = performance.now();
let remainder = 0;
function frame(now) {
  const dt = Math.min((now - previous)/1000,.075);
  previous = now;
  if (mode === 'playing' && !soundSettings.open) {
    remainder += dt;
    while (remainder >= tick && mode === 'playing') {
      update(tick);
      remainder -= tick;
    }
  } else {
    remainder = 0;
  }
  render(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
