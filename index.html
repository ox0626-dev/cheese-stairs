<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#103968">
<title>치즈 계단 · 움직임 테스트</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#103968}
  body{font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
  main{position:fixed;inset:0;width:100%;height:100%;height:100dvh;overflow:hidden;isolation:isolate;touch-action:none}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  button:focus-visible{outline:3px solid #fff0ab;outline-offset:4px}
  .hud{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:calc(env(safe-area-inset-left) + 18px);right:calc(env(safe-area-inset-right) + 18px);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
  .score{background:#0d2d55df;border:1px solid #a9d7ff57;border-radius:16px;padding:8px 13px 9px;min-width:83px;box-shadow:0 5px 18px #0c2f542a}
  .score span{display:block;font-size:12px;font-weight:650;color:#d5ebff}
  .score strong{font-size:26px;line-height:1.12;color:#ffea87;font-variant-numeric:tabular-nums}
  .actions{display:flex;gap:7px;pointer-events:auto}
  .icon{display:grid;place-items:center;border:1px solid #a9d7ff69;background:#0d2d55df;border-radius:13px;width:42px;height:42px;padding:0;font-size:21px;line-height:1}
  .icon[hidden]{display:none}
  .jump-hint{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:12px;font-weight:750;text-align:center;background:#0b3058dc;color:#ffee9b;border:1px solid #a9d7ff68;border-radius:30px;padding:8px 9px;white-space:nowrap;pointer-events:none}
  .message{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 58px);left:50%;width:min(350px,calc(100% - 34px));transform:translateX(-50%);text-align:center;padding:19px 15px 16px;background:#0c2c52f2;border:1px solid #a9d7ff7d;border-radius:24px;box-shadow:0 16px 55px #0b284b62}
  .message[hidden]{display:none}
  h1{font-size:clamp(22px,6.4vw,32px);line-height:1.08;letter-spacing:-.055em;margin:0}
  .message p{font-size:14px;line-height:1.45;margin:9px 0 14px;color:#d9ecff}
  .start{border:0;border-radius:13px;width:100%;background:#ffe47a;color:#172f4a;padding:10px 15px;font-size:16px;font-weight:830;min-height:44px;box-shadow:0 4px 0 #c39a41}
  .start:active{transform:translateY(2px);box-shadow:0 2px 0 #c39a41}
  @media(max-height:490px){.message{bottom:49px;padding:12px}.message p{margin:5px 0 8px}.hud{top:8px}}
</style>
</head>
<body>
<main id="game" aria-label="치즈 계단 움직임 테스트">
  <canvas id="field" aria-label="생쥐가 치즈 계단을 올라가는 화면"></canvas>
  <div class="hud">
    <div class="score"><span>최고 도달</span><strong id="score">0</strong><span>번째 계단</span></div>
    <div class="actions">
      <button type="button" id="fullscreen" class="icon" aria-label="전체 화면" title="전체 화면" hidden>⛶</button>
      <button type="button" id="pause" class="icon" aria-label="일시 정지" title="일시 정지" hidden>Ⅱ</button>
    </div>
  </div>
  <div id="jumpHint" class="jump-hint" hidden>좌우 터치로 점프 · 공중에서는 방향 전환</div>
  <section id="message" class="message" aria-labelledby="title">
    <h1 id="title">치즈 계단</h1>
    <p id="description">벽에 닿으면 멈춰요.<br>좌우를 터치해 점프하고, 공중에서는 방향을 바꿔요.</p>
    <button type="button" id="start" class="start">움직임 테스트 시작</button>
  </section>
</main>

    platforms.push({x:step.x * WIDTH,w:step.w * WIDTH,h:lastHeight,art:step.art,level});
    if (stepIndex === flight.length) {
      stepIndex = 0;
      flightIndex = (flightIndex + 1) % flights.length;
    }
  }
}

function resize() {
  const box = game.getBoundingClientRect();
  width = box.width;
  height = box.height;
  if (!width || !height) return;
  const ratio = Math.min(2.5, window.devicePixelRatio || 1);
  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(height * ratio);
  ctx.setTransform(ratio,0,0,ratio,0,0);
  scale = Math.min(width / WIDTH, height / 540, 1.85);
  offset = (width - WIDTH * scale) / 2;
  viewHeight = height / scale;
  if (mode === 'ready' && player) reset();
}

function setMode(next) {
  mode = next;
  message.hidden = next === 'playing';
  pause.hidden = next !== 'playing';
  jumpHint.hidden = next !== 'playing';
  if (next === 'paused') {
    title.textContent = '잠깐 쉬는 중';
    description.textContent = '이어서 치즈 계단을 올라가세요.';
    start.textContent = '계속하기';
  } else if (next === 'fallen') {
    title.textContent = '계단에서 떨어졌어요';
    description.textContent = '이번에 도달한 계단 ' + best + '개';
    start.textContent = '다시 시작';
  }
}

function startPlaying() {
  if (mode === 'playing') return;
  unlockAudio();
  if (mode !== 'paused') reset();
  start.blur();
  setMode('playing');
}

function standingOn(platform, x) {
  return Math.abs(x - platform.x) <= platform.w / 2 - SOLE_INSET;
}

function dust(x,h,amount,color) {
  for (let i=0;i<amount;i++) {
    sparks.push({x,h,vx:(Math.random()-.5)*106,vy:24+Math.random()*80,
      size:2+Math.random()*3,life:.32,max:.32,color});
  }
}

function requestJump(direction) {
  unlockAudio();
  if (player.push > 0 || (!player.ground && player.coyote === 0)) {
    player.dir = direction;
    return;
  }
  player.jumpDir = direction;
  player.buffer = .14;
}

function unlockAudio() {
  const AudioContextType = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextType) return;
  audioContext ||= new AudioContextType();
  if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
}

function playJumpSound() {
  if (audioContext?.state !== 'running') return;
  const time = audioContext.currentTime;
  const tone = audioContext.createOscillator();
  const spring = audioContext.createOscillator();
  const springVolume = audioContext.createGain();
  const volume = audioContext.createGain();

  tone.type = 'triangle';
  tone.frequency.setValueAtTime(260, time);
  tone.frequency.exponentialRampToValueAtTime(760, time + .075);
  tone.frequency.exponentialRampToValueAtTime(420, time + .27);

  spring.type = 'sine';
  spring.frequency.setValueAtTime(28, time);
  spring.frequency.exponentialRampToValueAtTime(11, time + .24);
  springVolume.gain.setValueAtTime(65, time);
  springVolume.gain.exponentialRampToValueAtTime(4, time + .24);
  spring.connect(springVolume).connect(tone.frequency);

  volume.gain.setValueAtTime(.001, time);
  volume.gain.exponentialRampToValueAtTime(.18, time + .017);
  volume.gain.exponentialRampToValueAtTime(.001, time + .29);
  tone.connect(volume).connect(audioContext.destination);
  tone.start(time);
  spring.start(time);
  tone.stop(time + .30);
  spring.stop(time + .30);
}

function update(dt) {
  elapsed += dt;
  player.buffer = Math.max(0, player.buffer - dt);
  if (player.buffer > 0 && !player.push && (player.ground || player.coyote > 0)) {
    player.buffer = 0;
    player.dir = player.jumpDir;
    player.push = PUSH_TIME;
  }
  const oldX = player.x;
  const oldHeight = player.h;
  const nextX = Math.max(EDGE, Math.min(WIDTH - EDGE, oldX + player.dir * SPEED * dt));
  player.x = nextX;
  if (player.ground && !player.push) {
    player.runDistance = (player.runDistance + Math.abs(nextX - oldX)) % RUN_CYCLE_DISTANCE;
  }

  if (player.ground && !standingOn(player.ground,nextX) && !player.push) {
    player.ground = null;
    player.coyote = .085;
    player.air = 0;
  }
  if (player.push > 0) {
    player.push -= dt;
    if (player.push <= 0) {
      player.push = 0;
      player.ground = null;
      player.coyote = 0;
      player.air = 0;
      player.vy = JUMP_SPEED;
      playJumpSound();
      dust(nextX,player.h,7,'#fff0ad');
    }
  }
  if (!player.ground && !player.push) {
    player.coyote = Math.max(0,player.coyote - dt);
    player.air += dt;
    player.vy -= GRAVITY * dt;
    player.h += player.vy * dt;
    if (player.vy <= 0) {
      let landing = null;
      for (const platform of platforms) {
        if (oldHeight < platform.h || player.h > platform.h) continue;
        const progress = (oldHeight - platform.h) / (oldHeight - player.h || 1);
        const crossX = oldX + (nextX - oldX) * progress;
        if (standingOn(platform,crossX) && standingOn(platform,nextX) &&
            (!landing || platform.h > landing.h)) landing = platform;
      }
      if (landing) {
        player.h = landing.h;
        player.ground = landing;
        player.vy = player.air = player.coyote = 0;
        dust(nextX,landing.h,5,'#fff0ad');
        if (landing.level > best) {
          best = landing.level;
          score.textContent = String(best);
        }
      }
    }
  }

  const target = player.h - viewHeight * .43;
  camera = Math.max(camera + 19 * dt, camera + (target - camera) * Math.min(dt * 5.5,1));
  addPlatforms();
  while (platforms.length && platforms[0].h < camera - 240) platforms.shift();
  for (const spark of sparks) {
    spark.x += spark.vx * dt;
    spark.h += spark.vy * dt;
    spark.vy -= 220 * dt;
    spark.life -= dt;
  }
  sparks = sparks.filter(spark => spark.life > 0);
  if (player.h < camera - 95) setMode('fallen');
}

function sky() {
  const gradient = ctx.createLinearGradient(0,0,0,height);
  gradient.addColorStop(0,'#123965');
  gradient.addColorStop(.50,'#4086b7');
  gradient.addColorStop(1,'#a5dbe8');
  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,width,height);

  const glow = ctx.createRadialGradient(width*.75,height*.72,0,width*.75,height*.72,Math.max(width,height)*.66);
  glow.addColorStop(0,'#ffebbc72');
  glow.addColorStop(.58,'#bce8ed24');
  glow.addColorStop(1,'#8bcbea00');
  ctx.fillStyle = glow;
  ctx.fillRect(0,0,width,height);

  const range = height + 110;
  ctx.fillStyle = '#fff4d3';
  for (let i=0;i<36;i++) {
    const x = ((i*67+17)%373)/373*width;
    const y = (((i*91+3)%451)/451*range + camera*scale*.16 + elapsed*2) % range - 44;
    const size = i%9===0 ? 2.5 : .85+(i%4)*.22;
    ctx.globalAlpha = .32+(i%7)*.075;
    ctx.beginPath();
    if (i%9===0) {
      ctx.moveTo(x,y-size*2);ctx.lineTo(x+size*.65,y-size*.65);
      ctx.lineTo(x+size*2,y);ctx.lineTo(x+size*.65,y+size*.65);
      ctx.lineTo(x,y+size*2);ctx.lineTo(x-size*.65,y+size*.65);
      ctx.lineTo(x-size*2,y);ctx.lineTo(x-size*.65,y-size*.65);
    } else {
      ctx.arc(x,y,size,0,Math.PI*2);
    }
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (let i=0;i<9;i++) {
    const depth = i%2;
    const cloudWidth = Math.min(width*.32,195)*(1+i%3*.22);
    const x = width*((i*29+3)%100)/100 + Math.sin(elapsed*.19+i)*12;
    const y = (((i*79+25)%389)/389*(height+200)+camera*scale*(depth ? .46 : .29))%(height+200)-85;
    cloud(x,y,cloudWidth,depth ? '#f1fbff35' : '#e0f6ff24');
  }
}

function cloud(x,y,w,color) {
  const h = w*.24;
  ctx.beginPath();
  ctx.ellipse(x,y,w*.53,h*.56,0,0,Math.PI*2);
  ctx.ellipse(x-w*.18,y-h*.24,w*.25,h*.66,0,0,Math.PI*2);
  ctx.ellipse(x+w*.04,y-h*.43,w*.30,h*.82,0,0,Math.PI*2);
  ctx.ellipse(x+w*.31,y-h*.18,w*.19,h*.54,0,0,Math.PI*2);
  ctx.fillStyle = color;
  ctx.fill();
}

function screenY(h) {
  return viewHeight - h + camera;
}

function drawPlatform(platform) {
  const image = art[platform.art];
  if (!image) return;
  const x = platform.x - platform.w / 2;
  const y = screenY(platform.h);
  if (y < -170 || y > viewHeight + 135) return;
  const h = platform.w * image.naturalHeight / image.naturalWidth;
  ctx.drawImage(image,x,y-h*.28,platform.w,h);
}

function drawMouse(now) {
  const airborne = !player.ground && !player.push;
  const stoppedAtWall = player.dir < 0 ? player.x <= EDGE : player.x >= WIDTH - EDGE;
  const walking = mode === 'playing' && player.ground && !player.push && !stoppedAtWall;
  const resting = mode === 'ready' || mode === 'paused' || (player.ground && !player.push && stoppedAtWall);
  const bounce = walking
    ? 2.7 * Math.sin(2 * Math.PI * player.runDistance / RUN_CYCLE_DISTANCE) ** 2
    : resting ? 1.8 * (.5 - .5 * Math.cos(now * .009)) : 0;
  const y = screenY(player.h) - bounce;
  ctx.save();
  ctx.translate(player.x,y);
  if (player.push > 0) {
    const pushing = player.push < PUSH_TIME*.65;
    drawPose(art[pushing ? 'jumpPush':'jumpReady'], -player.dir, 0, pushing ? 1.07 : .89);
  } else if (airborne) {
    drawPose(art[player.vy > 480 && player.air < .11 ? 'jumpPush' : 'jumpOpen'], -player.dir, 0, 1);
  } else {
    drawRun(walking);
  }
  ctx.restore();
}

function drawPose(image,orientation,bounce,stretch) {
  if (!image) return;
  const height = 78 * stretch;
  const width = height / stretch * image.naturalWidth / image.naturalHeight;
  ctx.save();
  ctx.scale(orientation,1);
  ctx.drawImage(image,-width*.64,-height-bounce,width,height);
  ctx.restore();
}

function drawRun(walking) {
  const frameIndex = Math.floor(player.runDistance * WALK_FRAMES.length / RUN_CYCLE_DISTANCE);
  const frame = walking ? WALK_FRAMES[frameIndex] : STANDING_FRAME;
  const image = art[frame.sprite] || art.walk;
  if (!image) return;
  const origin = art[frame.sprite] ? frame : STANDING_FRAME;
  const pixels = 76 / WALK_SPRITE_HEIGHT;
  ctx.save();
  ctx.scale(-player.dir, 1);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(image, -origin.x * pixels, -origin.y * pixels,
    image.naturalWidth * pixels, image.naturalHeight * pixels);
  ctx.restore();
}

function render(now) {
  if (!width || !height) return;
  sky();
  ctx.save();
  ctx.translate(offset,0);
  ctx.scale(scale,scale);
  for (const platform of platforms) drawPlatform(platform);
  for (const spark of sparks) {
    ctx.globalAlpha = spark.life / spark.max;
    ctx.fillStyle = spark.color;
    ctx.beginPath();
    ctx.arc(spark.x,screenY(spark.h),spark.size,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawMouse(now);
  ctx.restore();
}

canvas.addEventListener('pointerdown', event => {
  if (mode !== 'playing' || (event.pointerType === 'mouse' && event.button !== 0)) return;
  event.preventDefault();
  const bounds = canvas.getBoundingClientRect();
  requestJump(event.clientX < bounds.left + bounds.width / 2 ? -1 : 1);
});
canvas.addEventListener('contextmenu',event=>event.preventDefault());
start.addEventListener('click',startPlaying);
pause.addEventListener('click',()=>setMode('paused'));
document.addEventListener('keydown',event=>{
  if (!['Space','Escape','Enter'].includes(event.code)) return;
  if (event.target instanceof HTMLButtonElement && ['Enter','Space'].includes(event.code)) return;
  event.preventDefault();
  if (event.repeat) return;
  if (mode !== 'playing') {
    if (event.code==='Enter' || event.code==='Space') startPlaying();
    return;
  }
  if (event.code === 'Escape') setMode('paused');
  if (event.code === 'Space') requestJump(player.dir);
});
document.addEventListener('visibilitychange',()=>{
  if (document.hidden && mode==='playing') setMode('paused');
});
if (game.requestFullscreen && document.fullscreenEnabled) {
  fullscreen.hidden=false;
  fullscreen.addEventListener('click',async ()=>{
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await game.requestFullscreen();
    } catch {
      fullscreen.hidden=true;
    }
  });
  document.addEventListener('fullscreenchange',()=>{
    const label=document.fullscreenElement ? '전체 화면 닫기':'전체 화면';
    fullscreen.setAttribute('aria-label',label);
    fullscreen.title=label;
  });
}
new ResizeObserver(resize).observe(game);
resize();
reset();
